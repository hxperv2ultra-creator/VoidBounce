<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="watermark">Simple<b>Theme</b></div>
  <div id="arraylist"></div>
  <div id="info"><span id="fps">0</span> FPS</div>
  <div id="notifications"></div>

  <script>
    // Beispieldaten; echte Module/Events je nach LiquidBounce-Version anbinden
    const modules = [
      { name: "Velocity", tag: "Hypixel" },
      { name: "Super Knockback", tag: "WTap" },
      { name: "Inventory Move", tag: "Normal" },
      { name: "No Fall", tag: "SpoofGround" },
      { name: "Auto Clicker", tag: "" },
      { name: "Keep Sprint", tag: "" },
      { name: "Teams", tag: "" }
    ];

    function hue(i, n) {
      const t = n > 1 ? i / (n - 1) : 0;
      return `color-mix(in srgb, #7b5cff ${100 - t * 100}%, #38c6ff)`;
    }

    function render(list) {
      const sorted = [...list].sort(
        (a, b) => (b.name + b.tag).length - (a.name + a.tag).length
      );
      document.getElementById("arraylist").innerHTML = sorted
        .map((m, i) =>
          `<div class="entry" style="--accent:${hue(i, sorted.length)}">` +
          `<span>${m.name}</span>` +
          (m.tag ? `<span class="tag">${m.tag}</span>` : "") +
          `</div>`)
        .join("");
    }
    render(modules);

    // FPS-Anzeige (Platzhalter, per Client-API ersetzen)
    let frames = 0, last = performance.now();
    (function loop(now) {
      frames++;
      if (now - last >= 1000) {
        document.getElementById("fps").textContent = frames;
        frames = 0; last = now;
      }
      requestAnimationFrame(loop);
    })(last);
  </script>
</body>
</html>
